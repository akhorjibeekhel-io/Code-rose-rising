<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>art.py — ASCII rose</title>
<style>
:root{--bg:#000;--fg:#b9c0cc;--dim:#6b7380;--red:#ff5a5f;--grn:#3ddc6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#b9c0cc}}
:root[data-theme="dark"]{--bg:#000}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
#app{position:relative;height:100%;max-width:520px;margin:0 auto}
canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;left:12px;font-size:10px;line-height:1.5;color:var(--dim);white-space:pre}
#hudL{bottom:12px}
#hudR{top:14px;right:12px;color:var(--red);text-align:right;left:auto}
#code{position:absolute;left:0;right:0;bottom:0;height:34%;padding:8px 12px;font-size:10.5px;line-height:1.55;white-space:pre;overflow:hidden;color:#9fb3d9;
 -webkit-mask-image:linear-gradient(transparent,#000 35%);mask-image:linear-gradient(transparent,#000 35%)}
#code .k{color:#ff7b9c}#code .f{color:#e6c07b}#code .c{color:#5c6773}
#bar{position:absolute;top:12px;left:12px;display:flex;gap:8px;z-index:3}
button{background:#0008;color:var(--fg);border:1px solid #444;border-radius:999px;padding:7px 12px;font:12px ui-monospace,monospace}
#gate{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000d;text-align:center}
#gate b{font-size:44px}
#gate span{font-size:13px;color:var(--dim)}
#gate button{font-size:15px;padding:12px 22px;color:var(--red);border-color:var(--red)}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>
<div id="hudR" class="hud"></div>
<div id="hudL" class="hud"></div>
<div id="bar"><button id="mute" hidden>🔊 sound on</button><button id="replay">↻ replay</button></div>
<div id="gate"><b>🌹</b><span>send this rose to someone special</span><button id="go">▶ bloom with sound</button></div>
</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const COLS=64,LOOP=22;let W,H,dpr,cw,ch,rows,t0=performance.now(),playing=true;
const RAMP=" .:-=+*#%@",GLY="/\\|(){}$8&@oO0xrtvfjn1ui";
function rnd(s){s=Math.sin(s*127.1)*43758.5453;return s-Math.floor(s)}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);cw=W/COLS;ch=cw*1.9;rows=Math.floor(H*0.84/ch)}
addEventListener('resize',resize);resize();
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
// stars
const stars=Array.from({length:120},(_,i)=>({x:rnd(i+1),y:rnd(i+7)*0.8,p:rnd(i+3)*6,s:rnd(i+9)>0.85?1:0,r:0.5+rnd(i+5)*1.2}));
function field(u,v,t){ // u,v in 0..1 of rose area -> {k,val}
 const bloom=sm(5,15,t), grow=sm(0,3.2,t), swayA=Math.sin(Math.max(0,t-6)*0.9)*0.1*sm(6,9,t);
 // rotate about base (0.5,1)
 const dx=u-0.5,dy=v-1,c=Math.cos(-swayA),s=Math.sin(-swayA);
 const x=0.5+dx*c-dy*s,y=1+dx*s+dy*c;
 // stem
 const sx=0.5+0.025*Math.sin(y*5);
 if(y>0.5&&y<1&&Math.abs(x-sx)<0.022&&(1-y)/0.5<grow) return {k:1,val:0.55+0.45*Math.sin(y*60)*0.5+0.2};
 // leaves
 const lg=sm(2.6,4.6,t);
 for(const L of [{cx:0.40,cy:0.84,a:-0.5,s:1},{cx:0.62,cy:0.74,a:0.55,s:1}]){
  const rx=(x-L.cx),ry=(y-L.cy),ca=Math.cos(L.a),sa=Math.sin(L.a);
  const lx=(rx*ca+ry*sa)/(0.085*lg+1e-4),ly=(-rx*sa+ry*ca)/(0.036*lg+1e-4);
  const r=lx*lx+ly*ly;if(lg>0&&r<1) return {k:1,val:0.35+0.6*(1-r)*(0.6+0.4*Math.abs(Math.sin(lx*3)))};
 }
 // flower head
 const fb=sm(3.4,6,t);if(fb<=0) return null;
 const sc=(0.25+0.75*bloom)*fb, Rx=0.30*sc+1e-4, Ry=0.19*sc+1e-4, hx=0.5, hy=0.47-0.15*bloom*0.4-0.02;
 const fx=(x-hx)/Rx,fy=(y-hy)/Ry;const r=Math.sqrt(fx*fx+fy*fy),th=Math.atan2(fy,fx);
 const edge=1-0.14*Math.abs(Math.sin(th*2.5+r))+(fy>0?0:0.0)-(fy>0.4?(fy-0.4)*0.6:0);
 if(r<edge){
  const sp=0.5+0.5*Math.sin(th*2+r*(7+4*bloom)*Math.PI*0.5);
  const rim=smRim(r/edge);
  const val=0.25+0.5*sp+0.35*rim; return {k:2,val:Math.min(1,val),r};
 }
 return null;
}
function smRim(x){return x>0.8?(x-0.8)/0.2:0}
function draw(t){
 cx.clearRect(0,0,W,H);
 const gw=COLS,gh=rows,ox=0,oy=H*0.075;
 // stars
 for(const s of stars){const a=0.25+0.55*Math.abs(Math.sin(t*1.3+s.p))*sm(0.5,4,t);
  const X=s.x*W,Y=s.y*H*0.78+H*0.05;cx.fillStyle=`rgba(210,215,230,${a})`;cx.beginPath();cx.arc(X,Y,s.r,0,7);cx.fill();
  if(s.s){const L=6+5*Math.sin(t*2+s.p);cx.strokeStyle=`rgba(210,215,230,${a*0.8})`;cx.lineWidth=0.7;cx.beginPath();cx.moveTo(X-L,Y);cx.lineTo(X+L,Y);cx.moveTo(X,Y-L);cx.lineTo(X,Y+L);cx.stroke()}}
 cx.font=`${ch*0.95}px ui-monospace,Menlo,Consolas,monospace`;cx.textAlign='center';cx.textBaseline='middle';
 let letters=0;const fr=Math.floor(t*6);
 for(let j=0;j<gh;j++)for(let i=0;i<gw;i++){
  const f=field(i/gw,j/gh,t);if(!f)continue;
  let idx=Math.min(9,Math.floor(f.val*10));if(idx<1)idx=1;
  const sh=rnd(i*31+j*17+(f.k===2?fr*0.15:0));
  let ch_=idx>6&&sh>0.35?GLY[Math.floor(sh*GLY.length)]:RAMP[idx];
  const a=0.45+0.55*f.val;
  cx.fillStyle=f.k===1?`rgba(${40+60*f.val|0},${150+90*f.val|0},${80+30*f.val|0},${a})`:`rgba(${170+85*f.val|0},${35+50*f.val*f.val|0},${50+40*f.val|0},${a})`;
  cx.fillText(ch_,ox+(i+0.5)*cw,oy+(j+0.5)*ch);letters++;
 }
 document.getElementById('hudR').textContent=`● t ${t.toFixed(2)}s`;
 const bl=sm(5,15,t)*100,sw=Math.sin(Math.max(0,t-6)*0.9)*0.1*sm(6,9,t)*57.3;
 document.getElementById('hudL').textContent=`@art_lover · 2026\nbloom ${bl.toFixed(1)}%   sway ${sw.toFixed(2)}°\nletters ${letters.toLocaleString()}\n\nart.py   running · 30 fps`;
}
// code panel
const SRC=`<span class="k">def</span> <span class="f">reveal</span>(order, t):
    head = (t - DRAW[0]) / (DRAW[1] - DRAW[0]) * O_MAX
    soft = np.where(order &lt; 1.0, 0.09, 0.05)
    <span class="k">return</span> smooth((head - order) / soft)

<span class="k">def</span> <span class="f">bloom</span>(t):
    <span class="c"># a tight bud, then a full rose</span>
    u = np.clip((t - 5.5) / 9.0, 0, 1)
    <span class="k">return</span> smooth(u) * (2 - u)

<span class="k">def</span> <span class="f">sway</span>(t):
    <span class="k">return</span> 0.22 * np.sin(max(t - 7.0, 0) * 0.35)

<span class="k">def</span> <span class="f">lights</span>(t):
    <span class="c"># glitter all around the rose</span>
    twinkle = np.abs(np.sin(t * 1.3 + PHASE))
    <span class="k">return</span> 0.25 + 0.55 * twinkle

<span class="k">def</span> <span class="f">draw_order</span>():
    stem_o = STEM_S
    leaf_o = [LEAF_AT[k] + 0.05 for k in range(2)]
    petal_o = 1.10 + PETAL_V * 0.42
    <span class="k">return</span> stem_o, leaf_o, petal_o
`.split('\n');
// sound: original generative trip-hop / ambient bed
let ac,master,timer,muted=false,step=0,nextT=0;
const BPM=78,SP=60/BPM/2;
const CH=[[57,60,64],[53,57,60],[55,59,62],[52,55,59]];
const mt=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,a,d,pk){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function tone(f,t,len,type,vol,lp){const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);fl.connect(g);g.connect(master);env(g,t,len*0.3,len*0.7,vol);o.start(t);o.stop(t+len+0.1)}
function noise(t,len,vol,hp){const b=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;s.connect(f);f.connect(g);g.connect(master);env(g,t,0.005,len,vol);s.start(t)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+0.25);o.connect(g);g.connect(master);env(g,t,0.004,0.35,0.9);o.start(t);o.stop(t+0.5)}
function sched(){
 while(nextT<ac.currentTime+0.3){
  const s=step%64,bar=Math.floor(s/16)%4,k=s%16,ch=CH[bar];
  if(k===0){ch.forEach(m=>tone(mt(m),nextT,SP*16,'sine',0.08,900));tone(mt(ch[0]-24),nextT,SP*16,'sine',0.22,200)}
  if(k===0||k===10||(k===7&&bar%2))kick(nextT);
  if(k===4||k===12){noise(nextT,0.18,0.28,1800);tone(180,nextT,0.12,'triangle',0.1,900)}
  if(k%2===0)noise(nextT,0.05,0.05+0.03*(k%4===2),7000);
  if(k%3===1&&Math.random()>0.35)tone(mt(ch[Math.floor(Math.random()*3)]+12),nextT,SP*3,'triangle',0.05,2400);
  nextT+=SP;step++;
 }
}
function startAudio(){
 if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0.7;
  const dl=ac.createDelay(1),fb=ac.createGain(),lp=ac.createBiquadFilter();dl.delayTime.value=0.38;fb.gain.value=0.4;lp.frequency.value=1800;
  master.connect(ac.destination);master.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(ac.destination)}
 ac.resume();nextT=ac.currentTime+0.1;step=0;clearInterval(timer);timer=setInterval(sched,100);
}
function restart(){t0=performance.now()}
document.getElementById('go').onclick=()=>{document.getElementById('gate').remove();document.getElementById('mute').hidden=false;restart();startAudio()};
document.getElementById('mute').onclick=e=>{muted=!muted;master.gain.value=muted?0:0.7;e.target.textContent=muted?'🔇 sound off':'🔊 sound on'};
document.getElementById('replay').onclick=()=>{restart()};
(function loop(now){const t=((now-t0)/1000)%LOOP;draw(t);requestAnimationFrame(loop)})(performance.now());
</script>
</body>
</html>
